spring.application.name=soulmotors-api

# Variables locales: copia .env.example a .env (no se sube al repo).
# En Render se configuran como Environment Variables.
spring.config.import=optional:file:.env[.properties]

# Render inyecta PORT; en local se usa 8080.
server.port=${PORT:8080}
# El frontend usa baseURL .../api
server.servlet.context-path=/api

# Neon (PostgreSQL) — la URL debe llevar ?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=20000

# El esquema lo administra el script SQL de BD; Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Las columnas TIMESTAMP de Neon están en UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT: JWT_SECRET de al menos 32 caracteres; el token dura una jornada por defecto.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=soulmotors-api
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# CORS: lista separada por comas
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
